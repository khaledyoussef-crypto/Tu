name: Build APK Directly From ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Safely
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted_project
          python3 -m zipfile -e "$ZIP_FILE" extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          GRADLE_DIR=$(dirname "$(find extracted_project -name 'settings.gradle.kts' | head -n 1)")
          cd "$GRADLE_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatSub-v1.6.3-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
